<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Senda 28">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<title>Senda · Protocolo 28</title>
<style>
:root{--bg:#f5f2eb;--el:#fcfbf7;--bm:#ebe6da;--tx:#1c241e;--mu:#58635a;--pr:#2d5a43;--ph:#234735;--ps:#e0ece5;--ac:#a2672b;--as:#f5eadc;--bd:#dcd5c5;--dg:#a63d3d;--ds:#f7e4e4;--on:#fcfbf7;--sh:0 2px 8px rgba(28,36,30,.05);--nav:68px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#131915;--el:#1b241e;--bm:#243028;--tx:#edf1ec;--mu:#9aa79c;--pr:#63b086;--ph:#77c299;--ps:#1f362a;--ac:#df9f5d;--as:#33271a;--bd:#2c3830;--dg:#e88a8a;--ds:#382020;--on:#131915;--sh:0 2px 8px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
body{padding:var(--st) 0 calc(var(--nav) + var(--sb) + 24px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
main,#hd{max-width:560px;margin:0 auto;padding:0 16px}main{outline:0}#hd{padding-top:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--pr);color:var(--on);display:grid;place-items:center;font-weight:700}
.top h1{font-size:17px;margin:0}.top p{font-size:12px;color:var(--mu);margin:0}
.pg{margin-bottom:16px}.pm{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:6px}
.tr{height:8px;background:var(--bm);border-radius:9px;overflow:hidden}.tr i{display:block;height:100%;background:var(--pr);transition:width .25s}
.c{background:var(--el);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.c h2{font-size:16px;margin:0}.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.c p,.c li{font-size:14px}.mu{color:var(--mu)}.sm{font-size:12px}
.b{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700}
.dose{background:var(--ps);color:var(--pr)}.rest{background:var(--bm);color:var(--mu)}.closing{background:var(--as);color:var(--ac)}
.hl{font-size:22px;font-weight:700;margin:6px 0;letter-spacing:-.02em}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:48px;padding:10px 16px;border-radius:14px;border:0;font:700 15px inherit;font-family:inherit;cursor:pointer;width:100%;background:var(--bm);color:var(--tx)}
.btn.p{background:var(--pr);color:var(--on)}.btn.p:hover{background:var(--ph)}.btn.d{background:var(--ds);color:var(--dg)}
.btn.s{width:auto;min-height:40px;padding:6px 12px;font-size:13px}.btn[disabled]{opacity:.5}
.chip{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;text-align:left;width:100%;color:var(--tx)}
.chip.on{background:var(--ps);border-color:var(--pr);color:var(--pr)}.chip input{width:20px;height:20px;accent-color:var(--pr);flex:none}
.stack{display:flex;flex-direction:column;gap:8px}
textarea,input[type=text]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;font:inherit;font-size:15px}
.int{font-style:italic;background:var(--bg);padding:12px 14px;border-radius:14px;border-left:3px solid var(--pr);margin:8px 0}
.sg{margin-bottom:16px}.sh{display:flex;justify-content:space-between;margin-bottom:8px}.sh label{font-size:14px;font-weight:600}
.sv{font-size:13px;font-weight:700;color:var(--pr);background:var(--ps);padding:2px 10px;border-radius:99px;min-width:56px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;background:var(--bm)}
input[type=range][data-u]{opacity:.55}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--pr);border:3px solid var(--el)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--pr);border:3px solid var(--el)}
.al{background:var(--ds);border-color:var(--dg)}.al h2{color:var(--dg)}
.w3{background:linear-gradient(135deg,var(--ps),var(--el));border-color:var(--pr)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.st div{background:var(--el);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center}
.st b{display:block;font-size:18px;color:var(--pr)}.st span{font-size:11px;color:var(--mu)}
.ex{padding:12px 0;border-bottom:1px solid var(--bd)}.ex:last-child{border:0}
.pill{background:var(--bg);padding:2px 8px;border-radius:6px;border:1px solid var(--bd);font-size:12px;color:var(--mu)}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font:700 12px inherit;font-family:inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc.dose{background:var(--ps);color:var(--pr);border-color:var(--pr)}.dc.closing{background:var(--as);color:var(--ac);border-color:var(--ac)}.dc.cur{box-shadow:0 0 0 2px var(--tx)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{padding:4px;text-align:center;border-bottom:1px solid var(--bd)}
.lg{display:flex;gap:16px;font-size:12px;color:var(--mu);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);background:var(--el);border-top:1px solid var(--bd);display:flex;z-index:5}
.nb{flex:1;border:0;background:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.nb.on{color:var(--pr)}.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#t{position:fixed;top:calc(var(--st) + 16px);left:50%;transform:translate(-50%,-150%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;transition:transform .25s;z-index:9;pointer-events:none;max-width:90%}
#t.show{transform:translate(-50%,0)}.hid{display:none}
</style></head>
<body>
<div id="t" role="status" aria-live="polite"></div>
<div id="hd"></div>
<main id="v" tabindex="-1"></main>
<nav id="nv" aria-label="Navegación principal">
<button class="nb" data-a="tab" data-t="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>Hoy</button>
<button class="nb" data-a="tab" data-t="historial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M18 9l-5 5-4-4-3 3"/></svg>Historial</button>
<button class="nb" data-a="tab" data-t="protocolo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Protocolo</button>
</nav>
<script>
(()=>{
const K='senda_v2',OLD='senda_protocolo_28_v1',DEV=new URLSearchParams(location.search).has('dev');
const INT='Observar con curiosidad mi claridad, mi calma y mi presencia durante estos 28 días.';
const def=()=>({v:2,consent:false,start:null,pattern:'1-2',intention:INT,entries:{},archive:[],contact:''});
let mem=null,S=load(),tab='hoy',vd=null;
function load(){try{const r=localStorage.getItem(K);if(r)return{...def(),...JSON.parse(r)};const o=localStorage.getItem(OLD);if(o){const p=JSON.parse(o),s=def();s.pattern=p.pattern||s.pattern;s.intention=p.intention||s.intention;if(p.entries&&Object.keys(p.entries).length)s.archive.push({label:'Ciclo importado de la versión 1',entries:p.entries});return s}}catch(e){}return mem||def()}
const save=s=>{S=s;mem=s;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const iso=d=>d.toLocaleDateString('sv');
const dayNow=()=>{if(!S.start)return 0;const a=new Date();a.setHours(0,0,0,0);return Math.round((a-new Date(S.start+'T00:00:00'))/864e5)+1};
const PN={'1-2':'1 toma / 2 descanso','4-3':'4 tomas / 3 descanso','1-1':'Días alternos (1 / 1)'};
const TB={dose:'Toma programada',rest:'Descanso',closing:'Cierre'};
const SL=[['mood','Estado de ánimo'],['focus','Claridad y enfoque'],['energy','Energía física'],['calm','Calma y regulación']];
function info(d,p=S.pattern){
 if(d===28)return{t:'closing',h:'Día 28: cierre e integración',x:'Sin toma programada. Revisa qué notaste en estas cuatro semanas y conversa lo observado con tu acompañante o terapeuta.'};
 const k={'1-2':(d-1)%3===0,'4-3':(d-1)%7<4,'1-1':(d-1)%2===0}[p];
 return k?{t:'dose',h:`Día ${d}: toma programada`,x:'Sigue la indicación de tu profesional tratante. Registra cómo te sientes, sin juzgar el proceso.'}
 :{t:'rest',h:`Día ${d}: pausa e integración`,x:'Sin toma programada. Observa cómo te sientes y qué hábitos quieres sostener.'}}
const wk=d=>d<=7?'Semana 1 · Sintonización':d<=14?'Semana 2 · Ritmo y observación':d<=21?'Semana 3 · Consolidación':'Semana 4 · Síntesis y cierre';
let tm;const toast=m=>{const t=$('#t');t.textContent=m;t.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('show'),2600)};
const low=()=>{const k=Object.keys(S.entries).map(Number).sort((a,b)=>a-b).slice(-3);return k.length===3&&k.every(d=>{const e=S.entries[d];return[e.mood,e.calm].some(v=>v!=null&&v<=3)})};
const help=()=>`<p>Si estás en peligro inmediato, llama a emergencias (123 en Colombia). Línea 192, opción 4 (salud mental, Colombia) y Línea 106 (Bogotá). Fuera de Colombia, usa la línea de tu país.</p>${S.contact?`<p><strong>Tu contacto de apoyo:</strong> ${esc(S.contact)}</p>`:'<p class="mu">Puedes guardar el contacto de tu terapeuta en la pestaña Protocolo.</p>'}`;
const sl=(k,l,v)=>`<div class="sg"><div class="sh"><label for="s_${k}">${l}</label><output id="o_${k}" class="sv">${v==null?'—':v+' / 10'}</output></div><input type="range" id="s_${k}" min="1" max="10" value="${v??5}"${v==null?' data-u="1"':''}></div>`;
const FL=['Antecedentes personales o familiares (primer grado) de psicosis, esquizofrenia o trastorno bipolar','Uso de litio, ISRS, IMAO u otros psicofármacos','Condición cardíaca o hipertensión no controlada','Embarazo o lactancia'];
function onboard(){return`<section class="c"><h2>Antes de empezar</h2><p>Senda 28 es un diario de acompañamiento. <strong>No indica dosis, no diagnostica y no reemplaza a un profesional de salud.</strong> El uso de psilocibina está restringido en muchos países; verifica la normativa que aplica a tu caso.</p>
<p class="mu">Marca lo que aplique:</p><div class="stack">${FL.map((f,i)=>`<label class="chip"><input type="checkbox" class="fl" id="f${i}">${f}</label>`).join('')}<label class="chip"><input type="checkbox" id="f9">Soy menor de 18 años</label></div>
<p class="mu sm">Si marcaste alguna opción, necesitas el visto bueno de un profesional de salud antes de continuar.</p>
<div class="stack"><label class="chip"><input type="checkbox" id="ok1">Hablé con mi profesional de salud y me dio su visto bueno</label>
<label class="chip"><input type="checkbox" id="ok2">Entiendo que esta app no es un dispositivo médico y que mis datos se guardan solo en este dispositivo, sin cifrar</label></div><br>
<button class="btn p" data-a="start">Comenzar ciclo</button></section>`}
function done(){return`<section class="c"><h2>Completaste los 28 días</h2><p>Exporta tus registros y compártelos con tu profesional. Tómate un periodo de descanso antes de decidir si inicias otro ciclo.</p><div class="stack"><button class="btn" data-a="export">Exportar CSV</button><button class="btn p" data-a="newc">Archivar y empezar nuevo ciclo</button></div></section>`}
function hoy(){
 if(!S.consent)return onboard();const n=dayNow();if(n>28)return done();
 const d=vd??n,i=info(d),e=S.entries[d]||{},lock=d>n&&!DEV;
 return`${low()?`<section class="c al" role="alert"><h2>Tus últimos registros muestran ánimo o calma bajos</h2><p>Es una señal para hablar con alguien. Contacta hoy a tu terapeuta o a una línea de apoyo.</p>${help()}</section>`:''}
<section class="c"><div class="ch"><span class="b ${i.t}">${TB[i.t]}</span><span class="sm mu">${d===n?'Hoy':'Día '+d+' de 28'}</span></div>
<h2 class="hl">${i.h}</h2><p class="mu">${i.x}</p>
<div class="row"><button class="btn s" data-a="prev" aria-label="Día anterior">← Anterior</button><button class="btn s" data-a="today"${d===n?' disabled':''}>Ir a hoy</button><button class="btn s" data-a="next" aria-label="Día siguiente">Siguiente →</button></div></section>
${d>=15&&d<=21?`<section class="c w3"><h2>Semana 3: revisión</h2><ul><li>¿Tu intención sigue vigente o necesita un ajuste?</li><li>¿Cómo te sientes en los días sin toma?</li><li>¿Qué práctica breve (respiración, caminata, escritura) puedes sostener?</li></ul></section>`:''}
<section class="c"><div class="ch"><h2>Intención del ciclo</h2></div><p class="int">“${esc(S.intention)}”</p><details><summary>Editar</summary><br><label for="int" class="sm">Tu norte para estos 28 días</label><textarea id="int" rows="2">${esc(S.intention)}</textarea><br><br><button class="btn p" data-a="intent">Guardar intención</button></details></section>
<section class="c"><div class="ch"><h2>Registro del día ${d}</h2><span class="sm" style="color:var(--pr);font-weight:700">${S.entries[d]?'✓ Guardado':''}</span></div>
${lock?'<p class="mu">Este día aún no llega. Podrás registrarlo cuando corresponda.</p>':`<form id="ck" data-d="${d}"><p class="sm mu">Todo es opcional. Deja en “—” lo que no quieras responder.</p>
<fieldset class="stack" style="border:0;padding:0;margin:0 0 16px"><legend class="sm" style="font-weight:600;margin-bottom:6px">¿Tomaste hoy?</legend>
<label class="chip"><input type="radio" name="tk" value="1"${e.taken===true?' checked':''}>Sí, tomé</label><label class="chip"><input type="radio" name="tk" value="0"${e.taken===false?' checked':''}>No tomé</label></fieldset>
${SL.map(([k,l])=>sl(k,l,e[k])).join('')}
<label for="note" class="sm" style="font-weight:600">Nota breve (opcional)</label><textarea id="note" rows="2" placeholder="¿Qué notaste hoy en tu cuerpo, emociones o creatividad?">${esc(e.note)}</textarea><br><br>
<button class="btn p" type="submit">Guardar registro del día ${d}</button></form>`}</section>
<section class="c"><h2>¿Necesitas apoyo?</h2><details><summary>Ver líneas y contactos</summary>${help()}</details></section>`}
function hist(){
 const ks=Object.keys(S.entries).map(Number).sort((a,b)=>a-b),av=k=>{const v=ks.map(d=>S.entries[d][k]).filter(x=>x!=null);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'—'};
 const W=490,H=140,pl=22,pw=W-pl-10,ph=H-34,bw=Math.floor(pw/28)-4;
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ánimo por día del ciclo. La tabla inferior contiene los mismos datos.">`;
 [2,5,8,10].forEach(l=>{const y=12+ph-l/10*ph;g+=`<line x1="${pl}" y1="${y}" x2="${W-6}" y2="${y}" stroke="var(--bd)" stroke-dasharray="3 3"/><text x="2" y="${y+4}" font-size="9" fill="var(--mu)">${l}</text>`});
 for(let d=1;d<=28;d++){const x=pl+(d-1)*pw/28+2,e=S.entries[d];
  if(e&&e.mood!=null){const h=Math.max(6,e.mood/10*ph);g+=`<rect x="${x}" y="${12+ph-h}" width="${bw}" height="${h}" rx="3" fill="${e.taken?'var(--pr)':'var(--ac)'}"><title>Día ${d}: ánimo ${e.mood}/10</title></rect>`}
  else g+=`<rect x="${x}" y="${8+ph}" width="${bw}" height="4" rx="2" fill="var(--bm)"/>`;
  if(d===1||d%7===0)g+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="9" fill="var(--mu)">${d}</text>`}
 g+='</svg>';
 const tk=e=>e.taken===true?'Sí':e.taken===false?'No':'—',v=x=>x??'—';
 return`<div class="st"><div><b>${av('mood')}</b><span>Ánimo</span></div><div><b>${av('focus')}</b><span>Enfoque</span></div><div><b>${ks.length}/28</b><span>Registros</span></div><div><b>${ks.filter(d=>S.entries[d].taken).length}</b><span>Tomas</span></div></div>
<section class="c"><div class="ch"><h2>Ánimo por día</h2></div>${g}<div class="lg"><span><i style="background:var(--pr)"></i>Con toma</span><span><i style="background:var(--ac)"></i>Sin toma</span></div>
<details><summary class="sm">Ver como tabla</summary><div style="overflow-x:auto"><table><tr><th>Día</th><th>Toma</th><th>Ánimo</th><th>Enf.</th><th>Ener.</th><th>Calma</th></tr>${ks.map(d=>{const e=S.entries[d];return`<tr><td>${d}</td><td>${tk(e)}</td><td>${v(e.mood)}</td><td>${v(e.focus)}</td><td>${v(e.energy)}</td><td>${v(e.calm)}</td></tr>`}).join('')}</table></div></details></section>
<section class="c"><div class="ch"><h2>Registros</h2><button class="btn s" data-a="export">Exportar CSV</button></div>
${ks.length?[...ks].reverse().map(d=>{const e=S.entries[d];return`<article class="ex"><div class="ch" style="margin:0 0 6px"><strong>Día ${d}</strong><span class="b ${e.type||info(d).t}">${TB[e.type||info(d).t]}</span></div><div class="row" style="gap:6px"><span class="pill">Toma: ${tk(e)}</span>${SL.map(([k,l])=>`<span class="pill">${l.split(' ')[0]}: ${v(e[k])}</span>`).join('')}</div>${e.note?`<p>${esc(e.note)}</p>`:''}</article>`}).join(''):'<p class="mu">Aún no hay registros. Completa tu primer registro en “Hoy”.</p>'}</section>`}
function prot(){
 const n=dayNow();
 return`<section class="c"><h2>Esquema del calendario</h2><p class="mu">Cambiar el esquema ajusta el calendario, no tus registros pasados. El día 28 es siempre de cierre, sin toma.</p><div class="stack">
${Object.entries(PN).map(([k,l])=>`<button class="chip${S.pattern===k?' on':''}" data-a="pat" data-p="${k}" aria-pressed="${S.pattern===k}">${l}</button>`).join('')}</div></section>
<section class="c"><div class="ch"><h2>Mapa de los 28 días</h2><span class="sm mu">Toca un día</span></div><div class="gr">${Array.from({length:28},(_,j)=>{const d=j+1,i=info(d);return`<button class="dc ${i.t==='rest'?'':i.t}${d===n?' cur':''}" data-a="go" data-d="${d}" aria-label="Día ${d}, ${TB[i.t]}${S.entries[d]?', con registro':''}"><span>${d}</span><span style="font-size:9px">${S.entries[d]?'●':''}</span></button>`}).join('')}</div></section>
<section class="c"><h2>Contacto de apoyo</h2><p class="mu">Terapeuta o persona de confianza. Se muestra en la sección de apoyo.</p><label for="ct" class="sm">Nombre y teléfono</label><input type="text" id="ct" value="${esc(S.contact)}"><br><br><button class="btn" data-a="contact">Guardar contacto</button></section>
<section class="c"><h2>Ciclos y datos</h2><p class="mu">${S.archive.length} ciclo(s) archivado(s). Los datos viven solo en este dispositivo, sin cifrar.</p><div class="stack"><button class="btn" data-a="reset">Archivar y reiniciar al día 1</button><button class="btn d" data-a="wipe">Borrar todos mis datos</button></div></section>
${DEV?`<section class="c"><h2>Modo desarrollo</h2><div class="row"><button class="btn s" data-a="shift" data-n="-1">Día −1</button><button class="btn s" data-a="shift" data-n="1">Día +1</button><button class="btn s" data-a="seed">Cargar ejemplo</button></div></section>`:''}`}
function render(f){
 const n=dayNow(),d=Math.min(vd??n,28);
 $('#hd').innerHTML=`<header class="top"><div class="mark" aria-hidden="true">28</div><div><h1>Senda · Protocolo 28</h1><p>${PN[S.pattern]}</p></div></header>${S.consent&&n>=1?`<div class="pg"><div class="pm"><span>${wk(d)}</span><span>Día ${d} de 28</span></div><div class="tr" role="progressbar" aria-valuemin="1" aria-valuemax="28" aria-valuenow="${d}" aria-label="Progreso del ciclo"><i style="width:${d/28*100}%"></i></div></div>`:''}`;
 $('#nv').classList.toggle('hid',!S.consent);
 $('#v').innerHTML={hoy,historial:hist,protocolo:prot}[tab]();
 document.querySelectorAll('.nb').forEach(b=>{const on=b.dataset.t===tab;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
 if(f)$('#v').focus()}
const arch=()=>Object.keys(S.entries).length?[...S.archive,{label:'Ciclo del '+S.start,start:S.start,pattern:S.pattern,entries:S.entries}]:S.archive;
function csv(){
 const ks=Object.keys(S.entries).map(Number).sort((a,b)=>a-b);if(!ks.length)return toast('No hay registros para exportar');
 const q=s=>{s=String(s??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
 const rows=[['Dia','Tipo de dia','Toma','Animo','Enfoque','Energia','Calma','Nota'].map(q).join(',')];
 ks.forEach(d=>{const e=S.entries[d];rows.push([d,TB[e.type||info(d).t],e.taken===true?'Si':e.taken===false?'No':'',e.mood,e.focus,e.energy,e.calm,e.note].map(q).join(','))});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='senda_protocolo_28.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);toast('CSV descargado')}
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,n=dayNow();
 if(a==='tab'){tab=el.dataset.t;render(1)}
 else if(a==='prev'){vd=((vd??n)+26)%28+1;render()}
 else if(a==='next'){vd=(vd??n)%28+1;render()}
 else if(a==='today'){vd=null;render()}
 else if(a==='go'){vd=+el.dataset.d;tab='hoy';render(1)}
 else if(a==='start'){
  const fl=[...document.querySelectorAll('.fl')].some(x=>x.checked);
  if($('#f9').checked)return toast('Esta app es solo para personas mayores de 18 años');
  if(fl&&!$('#ok1').checked)return toast('Necesitas el visto bueno de tu profesional de salud');
  if(!$('#ok2').checked)return toast('Acepta las condiciones para continuar');
  save({...S,consent:true,start:iso(new Date())});vd=null;render(1)}
 else if(a==='intent'){const v=$('#int').value.trim();if(v){save({...S,intention:v});toast('Intención guardada')}render()}
 else if(a==='pat'){save({...S,pattern:el.dataset.p});render();toast('Esquema actualizado')}
 else if(a==='contact'){save({...S,contact:$('#ct').value.trim()});toast('Contacto guardado')}
 else if(a==='export')csv();
 else if(a==='newc'||a==='reset'){if(!confirm('Se archivará el ciclo actual y volverás al día 1. ¿Continuar?'))return;save({...S,archive:arch(),entries:{},start:iso(new Date())});vd=null;tab='hoy';render(1);toast('Nuevo ciclo iniciado')}
 else if(a==='wipe'){if(!confirm('Se borrarán todos tus datos de este dispositivo. Esto no se puede deshacer. ¿Continuar?'))return;save(def());tab='hoy';vd=null;render(1)}
 else if(a==='shift'){const s=new Date(S.start+'T00:00:00');s.setDate(s.getDate()-Number(el.dataset.n));save({...S,start:iso(s)});vd=null;render()}
 else if(a==='seed'){const e={...S.entries},n2=Math.min(dayNow(),28);for(let d=1;d<=n2;d++)if(!e[d]){const t=info(d).t;e[d]={taken:t==='dose',type:t,mood:6+d%3,focus:6+d%2,energy:5+d%3,calm:7,note:'',at:new Date().toISOString()}}save({...S,entries:e});render();toast('Datos de ejemplo cargados')}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.type==='range'){delete t.dataset.u;$('#o_'+t.id.slice(2)).textContent=t.value+' / 10'}});
document.addEventListener('submit',ev=>{
 const f=ev.target;if(f.id!=='ck')return;ev.preventDefault();const d=+f.dataset.d,tk=f.querySelector('[name=tk]:checked');
 const e={type:info(d).t,taken:tk?tk.value==='1':null,note:f.note.value.trim(),at:new Date().toISOString()};
 SL.forEach(([k])=>{const i=f.querySelector('#s_'+k);e[k]=i.dataset.u?null:+i.value});
 if(e.taken===null&&!e.note&&SL.every(([k])=>e[k]==null))return toast('Responde al menos una pregunta');
 save({...S,entries:{...S.entries,[d]:e}});render();toast(`Registro del día ${d} guardado`)});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
})();
</script></body></html>
